<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엔트리난독화</title>
    <link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'NanumSquare', sans-serif;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .container img {
            max-width: 480px;
            width: 90vw;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .coming-soon {
            margin-top: 24px;
            font-size: 15px;
            color: #888;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/encrypt.png" alt="엔트리난독화">
        <p class="coming-soon">5월 중 출시</p>
    </div>
</body>
</html>
